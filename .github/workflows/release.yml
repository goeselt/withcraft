---
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read # Least-privilege default

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Required to push the release commit and tag.
      id-token: write # Required to create a SLSA attestation for the release.
      attestations: write # Required to create a SLSA attestation for the release.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history needed to find the previous release tag

      - id: intent
        name: Intent Release
        uses: goeselt/intent@4ddbdcaca80e9eec590a81badeb0bc747fd65cbf # v1.3.0
        with:
          initial-version: '1.4.0'

      - name: Set Up Node
        if: steps.intent.outputs.release-needed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install Dependencies
        if: steps.intent.outputs.release-needed == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.intent.outputs.release-needed == 'true'
        run: npm run typecheck

      - name: Bump Version
        if: steps.intent.outputs.release-needed == 'true'
        env:
          VERSION: ${{ steps.intent.outputs.next-version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build
        if: steps.intent.outputs.release-needed == 'true'
        run: npm run build

      - name: Package
        if: steps.intent.outputs.release-needed == 'true'
        id: pkg
        env:
          VERSION: ${{ steps.intent.outputs.next-version }}
        run: |
          npm run package
          printf 'vsix=withcraft-%s.vsix\n' "$VERSION" >>"$GITHUB_OUTPUT"

      - name: Attest Build Provenance
        if: steps.intent.outputs.release-needed == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pkg.outputs.vsix }}

      - name: Commit Version
        if: steps.intent.outputs.release-needed == 'true'
        uses: goeselt/scribe@2d727b24c709116d2951b61d0091ed20bf777b72 # v1.2.3
        with:
          files: |
            package.json
            package-lock.json
          message: 'chore: bump ${{ steps.intent.outputs.release-tag }}'
          github-token: ${{ secrets.CONTENT_WRITE_PAT }}
          git-user-name: ${{ secrets.RELEASE_SIGNING_USER }}
          git-user-email: ${{ secrets.RELEASE_SIGNING_EMAIL }}
          signing-key: ${{ secrets.RELEASE_SIGNING_KEY }}

      - name: Release
        if: steps.intent.outputs.release-needed == 'true'
        uses: goeselt/dispatch@72482f5dee11ae6ad32d44b9d926c6d1708dea98 # v1.3.6
        with:
          release-tag: ${{ steps.intent.outputs.release-tag }}
          major-tag: ${{ steps.intent.outputs.major-tag }}
          minor-tag: ${{ steps.intent.outputs.minor-tag }}
          git-user-name: ${{ secrets.RELEASE_SIGNING_USER }}
          git-user-email: ${{ secrets.RELEASE_SIGNING_EMAIL }}
          signing-key: ${{ secrets.RELEASE_SIGNING_KEY }}
          assets: ${{ steps.pkg.outputs.vsix }}
